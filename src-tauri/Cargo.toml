[package]
name = "missiva"
version = "0.1.0"
description = "Missiva — client email per Linux"
edition = "2021"

[lib]
name = "missiva_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
imap = "2.4"
native-tls = "0.2"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "native-tls", "hostname"] }
mail-parser = "0.11"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["net", "io-util", "time", "macros", "sync"] }
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
sha2 = "0.10"
base64 = "0.22"
url = "2"
uuid = { version = "1", features = ["v4"] }

# Build di debug più leggere: senza info di debug complete il target occupa molto meno spazio.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
